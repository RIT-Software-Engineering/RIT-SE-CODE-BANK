name: Monorepo CI/CD

on:
  push:
    branches:
      - main
      - dev
      - '*-dev'
      - '*-cicd-testing'
  pull_request:
    branches:
      - main
      - dev
      - '*-dev'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    name: Setup & Cache Dependencies
    runs-on: ubuntu-latest
    outputs:
      nx-base: ${{ steps.set-base.outputs.base }}
      nx-head: ${{ steps.set-head.outputs.head }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set base and head commits for Nx
        id: set-base
        run: echo "base=origin/main" >> $GITHUB_OUTPUT

      - name: Set head commit
        id: set-head
        run: echo "head=HEAD" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Nx output
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-cache-${{ github.sha }}

  lint:
    name: Lint Affected Projects
    needs: setup
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
        working-directory: apps/cmt/cmt-project
      - run: npm run lint
        working-directory: apps/cmt/cmt-project

