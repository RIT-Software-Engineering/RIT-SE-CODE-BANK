  build:
    name: Build Affected Projects
    needs: [setup, lint]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with: 
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
        working-directory: apps/cmt/cmt-project
      - run: npm ci
        working-directory: ./
      - run: CI=false npx nx affected:build --base=${{ needs.setup.outputs.nx-base }} --head=${{ needs.setup.outputs.nx-head }}
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: dist/

  deploy:
    # Placeholder for deployment. Reliant on deployment scripts that don't yet exist.
    name: Deploy Affected Apps
    if: github.ref == 'refs/heads/main' || endsWith(github.ref, '-dev') || github.ref == 'refs/heads/dev' || endsWith(github.ref, '-cicd-testing')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract App Name from Branch
        id: parse
        run: |
          BRANCH=${GITHUB_REF##*/}
          if [[ "$BRANCH" == *-dev ]]; then
            APP_NAME="${BRANCH%-dev}"
          elif [[ "$BRANCH" == "dev" || "$BRANCH" == "main" ]]; then
            APP_NAME="all"  # fallback or global deploy logic
          else
            APP_NAME="cmt"
          fi
          echo "APP_NAME=$APP_NAME" >> $GITHUB_ENV
          echo "::notice ::Branch '$BRANCH' targets app '$APP_NAME'"

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CMT_DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "DEPLOY_KEY=$HOME/.ssh/deploy_key" >> $GITHUB_ENV

      - name: Add staging server to known_hosts
        run: |
          ssh-keyscan -H apps-staging.se.rit.edu >> ~/.ssh/known_hosts

      - name: Deploy script
        run: |
          if [ "$APP_NAME" = "all" ]; then
            echo "Deploying all apps"
            chmod +x ./scripts/deploy-all.sh
            ./scripts/deploy-all.sh
          elif [ -f "./scripts/deploy-$APP_NAME.sh" ]; then
            echo "Deploying $APP_NAME"
            chmod +x "./scripts/deploy-$APP_NAME.sh"
            ./scripts/deploy-$APP_NAME.sh
          else
            echo "No deployment script found for $APP_NAME, skipping."
          fi