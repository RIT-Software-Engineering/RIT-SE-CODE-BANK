# GitHub Actions CI/CD workflow for TA Portal

name: TA Portal CI

on:
  push:
    branches: [ main, 'ta-portal-dev*' ]
    paths: ['apps/ta-portal/**']
  pull_request:
    branches: [ main, 'ta-portal-dev*' ]
    paths: ['apps/ta-portal/**']

jobs:
  test-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
        working-directory: ./apps/ta-portal/server
      - run: npx prisma generate
        working-directory: ./apps/ta-portal/server
      - run: npm test
        working-directory: ./apps/ta-portal/server
    
  test-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
        working-directory: ./apps/ta-portal/ui
      - run: npm test
        working-directory: ./apps/ta-portal/ui
