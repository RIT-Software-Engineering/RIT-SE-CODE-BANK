name: Monorepo CI/CD

on:
  push:
    branches:
      - main
      - dev
      - '*-dev'
      - 'ta-portal-notification-quick-fix'
  pull_request:
    branches:
      - main
      - dev
      - '*-dev'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    name: Setup & Cache Dependencies
    runs-on: ubuntu-latest
    outputs:
      nx-base: ${{ steps.set-base.outputs.base }}
      nx-head: ${{ steps.set-head.outputs.head }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set base and head commits for Nx
        id: set-base
        run: echo "base=origin/main" >> $GITHUB_OUTPUT

      - name: Set head commit
        id: set-head
        run: echo "head=HEAD" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Cache Nx output
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-cache-${{ github.sha }}
  
  build:
    name: Build Affected Projects
    needs: setup
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: NX_DAEMON=false npx nx affected:build --base=${{ needs.setup.outputs.nx-base }} --head=${{ needs.setup.outputs.nx-head }}
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: dist/

  deploy:
    # Placeholder for deployment. Reliant on deployment scripts that don't yet exist.
    name: Deploy Affected Apps
    if: github.ref == 'refs/heads/main' || endsWith(github.ref, '-dev') || github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/ta-portal-notification-quick-fix'
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      - name: Setup SSH Key
        if: env.APP_NAME != ''
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.TA_PORTAL_DEPLOY_SSH_KEY }}" > ../github-actions-deploy
          chmod 600 ../github-actions-deploy
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts
      
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Run Affected Deploy
        env:
          DEPLOY_USER: ${{ secrets.TA_PORTAL_DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KEY: ${{ github.workspace }}/../github-actions-deploy
        run: CI=false npx nx affected -t deploy -v --base=${{ needs.setup.outputs.nx-base }} --head=${{ needs.setup.outputs.nx-head }}