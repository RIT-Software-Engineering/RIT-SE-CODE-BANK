name: Monorepo CI/CD

on:
  push:
    branches:
      - main
      - dev
      - '*-dev'
  pull_request:
    branches:
      - main
      - dev
      - '*-dev'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    name: Setup & Cache Dependencies
    runs-on: ubuntu-latest
    outputs:
      nx-base: ${{ steps.set-base.outputs.base }}
      nx-head: ${{ steps.set-head.outputs.head }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set base and head commits for Nx
        id: set-base
        run: echo "base=origin/main" >> $GITHUB_OUTPUT

      - name: Set head commit
        id: set-head
        run: echo "head=HEAD" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Cache Nx output
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-cache-${{ github.sha }}

  lint:
    name: Lint Affected Projects
    needs: setup
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --ignore-scripts
      - run: NX_DAEMON=false npx nx affected:lint --base=${{ needs.setup.outputs.nx-base }} --head=${{ needs.setup.outputs.nx-head }}

  test:
    name: Test Affected Projects
    needs: setup
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --ignore-scripts
      - run: NX_DAEMON=false npx nx affected:test --base=${{ needs.setup.outputs.nx-base }} --head=${{ needs.setup.outputs.nx-head }} --code-coverage
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            **/coverage/**

  sonarqube:
    name: SonarQube Analysis
    needs: test
    runs-on: ubuntu-latest
    continue-on-error: true  
    if: github.event_name != 'pull_request'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run SonarQube Scanner
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          npx sonar-scanner \
            -Dsonar.projectKey=my-nx-monorepo \
            -Dsonar.organization=my-org \
            -Dsonar.sources=. \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.login=$SONAR_TOKEN \
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info

  codecov:
    name: Upload to Codecov
    needs: test
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: coverage/
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: |
            coverage/**/lcov.info
          flags: unittests
          name: RIT-SE-CODE-BANK
          fail_ci_if_error: false
  
  build:
    name: Build Affected Projects
    needs: setup
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --ignore-scripts
      - run: NX_DAEMON=false npx nx affected:build --base=${{ needs.setup.outputs.nx-base }} --head=${{ needs.setup.outputs.nx-head }}
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: dist/

  deploy:
    # Placeholder for deployment. Reliant on deployment scripts that don't yet exist.
    name: Deploy Affected Apps
    if: github.ref == 'refs/heads/main' || endsWith(github.ref, '-dev') || github.ref == 'refs/heads/dev'
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract App Name from Branch
        id: parse
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          if [[ "$BRANCH" == *-dev ]]; then
            # Extract base app name (e.g., ta-portal from ta-portal-*-dev)
            APP_NAME="${BRANCH%%-dev*}"  # Get everything before first -dev
            FIRST_PART="${APP_NAME%%-*}" # Get first part (ta-portal)
            SECOND_PART="${APP_NAME#*-}"
            SECOND_PART="${SECOND_PART%%-*}"
            if [[ "$FIRST_PART" == "$SECOND_PART" ]]; then
                APP_NAME="${FIRST_PART}"
            else
                APP_NAME="${FIRST_PART}-${SECOND_PART}"
            fi      
          elif [[ "$BRANCH" == "dev" || "$BRANCH" == "main" ]]; then
            APP_NAME="all"
          else
            APP_NAME=""
          fi
          echo "APP_NAME=$APP_NAME" >> $GITHUB_ENV
          echo "::notice ::Branch '$BRANCH' targets app '$APP_NAME'"

      - name: Setup SSH Key
        if: env.APP_NAME != ''
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts


      - name: Deploy script
        if: env.APP_NAME != ''
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          if [ "$APP_NAME" = "all" ]; then
            echo "Deploying all apps"
            chmod +x ./scripts/deploy-all.sh
            ./scripts/deploy-all.sh
          elif [ -f "./scripts/deploy-$APP_NAME.sh" ]; then
            echo "Deploying $APP_NAME"
            echo "${{ secrets.DEPLOY_HOST }}"
            chmod +x "./scripts/deploy-$APP_NAME.sh"
            "./scripts/deploy-$APP_NAME.sh"
          else
            echo "No deployment script found for $APP_NAME, skipping."
          fi