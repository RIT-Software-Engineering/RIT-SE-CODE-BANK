name: cmt

services:
  frontend:
    build:
      context: ../..
      dockerfile: apps/cmt/frontend/Dockerfile
    image: frontend:${TAG:-latest}

  backend:
    build:
      context: ../..
      dockerfile: apps/cmt/backend/Dockerfile
    image: backend:${TAG:-latest}
    
  notifications:
    build:
      context: ../..
      dockerfile: apps/cmt/notifications.Dockerfile
    image: notifications:${TAG:-latest}