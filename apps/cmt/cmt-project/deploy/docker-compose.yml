services:
  mariadb:
    image: mariadb:latest
    environment:
      MYSQL_ROOT_PASSWORD: cmt_root_pass
      MYSQL_DATABASE: cmt_db
      MYSQL_USER: cmt_user
      MYSQL_PASSWORD: cmt_pass
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - mariadb_data:/var/lib/mysql
    restart: unless-stopped

  workflows-backend:
    build:
      context: ../../workflows/server  # Path to workflows service
      dockerfile: Dockerfile
    ports:
      - "5011:5011"  # Workflows backend port
    environment:
      NODE_ENV: production
      PORT: 5011
      DATABASE_URL: mysql://cmt_user:cmt_pass@mariadb:3306/cmt_db
    depends_on:
      mariadb:
        condition: service_healthy
    restart: unless-stopped

  cmt-backend:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    ports:
      - "5010:5010"
    environment:
      NODE_ENV: production
      PORT: 5010
      DATABASE_URL: mysql://cmt_user:cmt_pass@mariadb:3306/cmt_db
    depends_on:
      mariadb:
        condition: service_healthy
    restart: unless-stopped

  cmt-frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - REACT_APP_BACKEND_URL=/api
        - PUBLIC_URL=/cmt
    ports:
      - "3010:3010"
    environment:
      NODE_ENV: production
      PORT: 3010
      REACT_APP_BACKEND_URL: /api
      PUBLIC_URL: /cmt
    depends_on:
      - cmt-backend
      - workflows-backend
    restart: unless-stopped

volumes:
  mariadb_data: