services:
  mariadb:
    image: mariadb:latest
    environment:
      MYSQL_ROOT_PASSWORD: cmt_root_pass
      MYSQL_DATABASE: cmt_db
      MYSQL_USER: cmt_user
      MYSQL_PASSWORD: cmt_pass
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - mariadb_data:/var/lib/mysql
    restart: unless-stopped

  # workflows-backend:
  #   build:
  #     context: ../../../apps/workflow/server
  #     dockerfile: Dockerfile
  #   ports:
  #     - "5011:5011"
  #   environment:
  #     NODE_ENV: production
  #     PORT: 5011
  #     DATABASE_URL: mysql://cmt_user:cmt_pass@mariadb:3306/workflows_db
  #   depends_on:
  #     mariadb:
  #       condition: service_healthy
  #   restart: unless-stopped

  workflows-backend:
    build:
      context: ../../../apps/workflow/server
      dockerfile: Dockerfile
    ports:
      - "5011:5011"
    environment:
      NODE_ENV: production
      PORT: 5011
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_ROOT_PASSWORD: cmt_root_pass
      DB_NAME_WORKFLOWS: workflows_db
      DB_APP_USER: cmt_user
      DB_APP_PASSWORD: cmt_pass
    depends_on:
      mariadb:
        condition: service_healthy
    restart: unless-stopped

  cmt-backend:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    ports:
      - "5010:5010"
    env_file:
      - .env.staging
    environment:
      NODE_ENV: production
      PORT: 5010
      DATABASE_URL: mysql://cmt_user:cmt_pass@mariadb:3306/cmt_db
    depends_on:
      mariadb:
        condition: service_healthy
    # ensure backend waits for DB port to be open before starting
    entrypoint: ["sh", "-c", "\
      until nc -z mariadb 3306; do echo waiting for mariadb; sleep 1; done; \
      node server.js"]

    restart: unless-stopped
  
  proxy:
    image: nginx:alpine
    ports:
      - "8080:80"    # bind to 8080 on the host to avoid conflicts
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    command: ["sh", "-c", "rm -f /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"]
    depends_on:
      - cmt-frontend
      - cmt-backend

  cmt-frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        REACT_APP_BACKEND_URL: /api
        REACT_APP_AUTH_BASE: ""
        PUBLIC_URL: /cmt
    ports:
      - "3010:3010"
    environment:
      NODE_ENV: production
      PORT: 3010
      REACT_APP_BACKEND_URL: /api
      REACT_APP_AUTH_BASE: ""
      PUBLIC_URL: /cmt
    depends_on:
      - cmt-backend
      - workflows-backend
    restart: unless-stopped

volumes:
  mariadb_data: