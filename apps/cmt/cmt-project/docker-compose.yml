services:
  mariadb:
    image: mariadb:latest
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - mariadb_data:/var/lib/mysql
    restart: unless-stopped

  workflows-backend:
    build:
      context: ../../../apps/workflow/server
      dockerfile: Dockerfile
    ports:
      - "${WORKFLOWS_PORT}:5011"
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: 5011
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      mariadb:
        condition: service_healthy
    restart: unless-stopped

  cmt-backend:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    ports:
      - "${BACKEND_PORT}:5010"
    env_file:
      - .env.staging
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: 5010
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      mariadb:
        condition: service_healthy
    restart: unless-stopped

  cmt-frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        REACT_APP_BACKEND_URL: ${REACT_APP_BACKEND_URL}
        REACT_APP_AUTH_BASE: ${REACT_APP_AUTH_BASE}
        PUBLIC_URL: ${PUBLIC_URL}
    ports:
      - "${FRONTEND_PORT}:3010"
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: 3010
      REACT_APP_BACKEND_URL: ${REACT_APP_BACKEND_URL}
      REACT_APP_AUTH_BASE: ${REACT_APP_AUTH_BASE}
      PUBLIC_URL: ${PUBLIC_URL}
    depends_on:
      - cmt-backend
      - workflows-backend
    restart: unless-stopped

volumes:
  mariadb_data: