version: "3.8"
services:
  mariadb:
    image: mariadb:latest
    environment:
      MYSQL_ROOT_PASSWORD: cmt_root_pass
      MYSQL_DATABASE: cmt_db # ← Database name
      MYSQL_USER: cmt_user
      MYSQL_PASSWORD: cmt_pass
    # ... healthcheck, volumes, restart configs

  cmt-backend:
    build:
      context: . # ← Build context is project root
      dockerfile: src/backend/Dockerfile
    ports:
      - "5010:5010" # ← CHANGED: Port 5010
    environment:
      NODE_ENV: production
      PORT: 5010
      DATABASE_URL: mysql://cmt_user:cmt_pass@mariadb:3306/cmt_db
    depends_on:
      mariadb:
        condition: service_healthy

  cmt-frontend:
    build:
      context: . # ← Build context is project root
      dockerfile: Dockerfile
    ports:
      - "3010:3010" # ← CHANGED: Port 3010
    environment:
      NODE_ENV: production
      PORT: 3010
      REACT_APP_BACKEND_URL: http://localhost:5010 # ← Will need updating
    depends_on:
      - cmt-backend

volumes:
  mariadb_data:
