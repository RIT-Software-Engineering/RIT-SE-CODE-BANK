openapi: 3.0.3

info:
  title: Permissions API
  version: 1.0.0

tags: 
  - name: Permissions
    description: Endpoints associated with permissions

paths:
  /permissions/{id}:
    get:
      summary: Get a permission by ID
      description: Returns the permission with the specified ID
      operationId: getPermissionById
      tags: [Permissions]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Permission object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Permission'

    put:
      summary: Update a permission by ID
      description: Updates the permission with the specified ID using the data provided in the body
      operationId: updatePermission
      tags: [Permissions]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        description: Fields to update permission
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                actingUserId:
                  type: string
                permissionType:
                  type: string
                  description: Must be one of the valid permission types.
      responses:
        '200':
          description: Updated permission object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Permission'
        '403':
          description: Forbidden (authorization failed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      summary: Delete a permission by ID
      description: Deletes the permission with the specified ID
      operationId: deletePermission
      tags: [Permissions]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        description: Acting user ID for authorization
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                actingUserId:
                  type: string
      responses:
        '200':
          description: Permission deletion confirmation
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Deleted"
        '403':
          description: Forbidden (authorization failed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /permissions:
    get:
      summary: Get permissions filtered by userId, actionId, and/or permissionType
      description: Returns all permissions based on the filters specified in the query parameters
      operationId: getPermissions
      tags: [Permissions]
      parameters:
        - name: userId
          in: query
          schema:
            type: string
        - name: actionId
          in: query
          schema:
            type: string
        - name: permissionType
          in: query
          schema:
            type: string
            description: Must be a valid permission type
      responses:
        '200':
          description: Array of permissions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Permission'

    post:
      summary: Create a new permission
      description: Creates a new permission using the data passed in the body
      operationId: createPermission
      tags: [Permissions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                actingUserId:
                  type: string
                newUserId:
                  type: string
                actionId:
                  type: string
                permissionType:
                  type: string
                  description: Must be one of the valid permission types.
              required:
                - actingUserId
                - newUserId
                - actionId
                - permissionType
      responses:
        '200':
          description: Created permission object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Permission'
        '403':
          description: Forbidden (authorization failed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    Permission:
      type: object
      properties:
        id:
          type: string
        user_id:
          type: string
        action_id:
          type: string
        permission_type:
          type: string
      required:
        - id
        - user_id
        - action_id
        - permission_type

    Error:
      type: object
      properties:
        message:
          type: string
      required:
        - message
