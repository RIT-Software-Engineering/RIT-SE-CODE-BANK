services:
  mariadb:
    image: mariadb:latest
    environment:
      MYSQL_ROOT_PASSWORD: ta_root_password
      MYSQL_DATABASE: ta_portal_db
      MYSQL_USER: ta_user
      MYSQL_PASSWORD: ta_password
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - mariadb_data:/var/lib/mysql
    restart: unless-stopped

  ta-portal-backend:
    build:
      context: ./apps/ta-portal/server
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: mysql://ta_user:ta_password@mariadb:3306/ta_portal_db
    restart: unless-stopped

  ta-portal-frontend:
    build:
      context: ./apps/ta-portal/ui
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_BACKEND_URL: http://localhost:5000
    depends_on:
      - ta-portal-backend
    restart: unless-stopped

volumes:
  mariadb_data: