services:
  mariadb_main:
    image: mariadb:11
    container_name: mariadb_scoop_portal
    environment:
      MARIADB_ROOT_PASSWORD: password
      MARIADB_DATABASE: scoop_portal_demo
    ports:
      - "3306:3306"
    volumes:
      - mariadb_scoop_portal_data:/var/lib/mysql

  mariadb_workflows:
    image: mariadb:11
    container_name: mariadb_workflows
    environment:
      MARIADB_ROOT_PASSWORD: password
      MARIADB_DATABASE: scoop_portal_demo
    ports:
      - "3307:3306"
    volumes:
      - mariadb_workflows_data:/var/lib/mysql
  
  mariadb_notifications:
    image: mariadb:11
    container_name: mariadb_notifications
    environment:
      MARIADB_ROOT_PASSWORD: password
      MARIADB_DATABASE: notification_service
    ports:
      - "3309:3306"
    volumes:
      - mariadb_notifications_data:/var/lib/mysql
  
  keycloak_mariadb:
    image: mariadb:11
    container_name: keycloak_mariadb
    environment:
      MARIADB_ROOT_PASSWORD: password
      MARIADB_DATABASE: keycloak
    ports:
      - "3312:3306"
    volumes:
      - mariadb_keycloak_data:/var/lib/mysql

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak
    environment:
      KC_DB: mariadb
      KC_DB_URL: jdbc:mariadb://keycloak_mariadb:3306/keycloak
      KC_DB_USERNAME: root
      KC_DB_PASSWORD: password

      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8080
      KC_HOSTNAME_STRICT: false
      KC_HOSTNAME_STRICT_HTTPS: false

      KC_LOG_LEVEL: info
      KC_METRICS_ENABLED: true
      KC_HEALTH_ENABLED: true
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    command: start-dev
    depends_on:
      - keycloak_mariadb
    ports:
      - 8080:8080


volumes:
  mariadb_scoop_portal_data:
  mariadb_workflows_data:
  mariadb_notifications_data:
  mariadb_keycloak_data: