version: '3.8'

services:
  mariadb:
    image: mariadb:latest
    container_name: mariadb
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-DB_PASSWORD}
      MYSQL_DATABASE: workflow_db
      MYSQL_USER: ${DB_USER:-TA_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD:-TA_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck: 
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"] # Periodically runs mysqladmin ping -h localhost to check if the DB is up
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped # This flag ensures the container restarts on failure

  workflow-api:
    build: ./apps/workflow/server
    container_name: ta-portal-workflow-api
    environment:
      DATABASE_URL: mysql://ta_user:ta_password@mariadb:3306/workflow_db
      PORT: 3001
      BASE_URL: http://apps-staging.se.rit.edu/
      NODE_ENV: production
    depends_on:
      mariadb:
        condition: service_healthy
    restart: unless-stopped

  ta-portal-backend:
    build: ./apps/ta-portal/server
    container_name: ta-portal-backend
    environment:
      DATABASE_URL: mysql://${DB_USER:-ta_user}:${DB_PASSWORD:-ta_password}@mariadb:3306/workflow_db
      WORKFLOWS_URL: http://workflow-api:3001
      PORT: 3300

  ta-portal-frontend:
    build: ./apps/ta-portal/ui
    container_name: ta-portal-frontend
    environment:
      NEXT_PUBLIC_BACKEND_URL: http://apps-staging.se.rit.edu
      NEXT_PUBLIC_API_EXTENSION: /api
    ports:
      - "3000:3000"
    depends_on:
      - ta-portal-backend
    restart: unless-stopped


volumes:
  db_data: {}

    
    