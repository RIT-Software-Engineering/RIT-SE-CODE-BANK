services:
  mariadb:
    image: mariadb:latest
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ta_root_password
      MYSQL_DATABASE: ta_portal_db
      MYSQL_USER: ta_user
      MYSQL_PASSWORD: ta_password
    volumes:
      - mariadb_prod_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
  ta-portal-backend:
    build:
     context: ./apps/ta-portal/server
     dockerfile: Dockerfile
     args:
       DATABASE_URL: mysql://root:ta_root_password@mariadb:3306/ta_portal_db
    environment:
      DATABASE_URL: mysql://root:ta_root_password@mariadb:3306/ta_portal_db
      PORT: 3300 #Port 5000 on the Prod server
      NODE_ENV: production
    ports:
      - "3300:3300" #Port 5000 on the Prod server
    restart: unless-stopped

  ta-portal-frontend:
    build:
      context: ./apps/ta-portal/ui
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_NODE_ENV: PROD
        NEXT_PUBLIC_BACKEND_URL: http://apps-staging.se.rit.edu
        NEXT_PUBLIC_API_EXTENSION: /api
        NEXT_PUBLIC_DATABASE_API_EXTENSION: /db
    environment:
      NEXT_PUBLIC_BACKEND_URL: http://apps-staging.se.rit.edu
      NEXT_PUBLIC_API_EXTENSION: /api
    ports:
      - "3000:3000" 
    depends_on:
      - ta-portal-backend
    restart: unless-stopped


volumes:
  mariadb_prod_data: