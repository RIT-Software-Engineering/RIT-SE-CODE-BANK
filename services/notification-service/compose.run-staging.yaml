name: notification-service

services:
  mariadb:
    image: mariadb:11
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_APP_USER}
      MYSQL_PASSWORD: ${DB_USER_PASSWORD:-user_password}
    ports:
      - ${DB_HOST_PORT}:3306
    volumes:
      - notification_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
  
  notify:
    image: notification-service:${TAG:-latest}
    environment:
      SMTP_HOST: smtp4dev
      SMTP_PORT: ${SMTP_PORT}
      SMTP_FROM: ${SMTP_FROM}
      PORT: ${NOTIF_HOST_PORT}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-xoxb}
      DATABASE_URL: "mysql://${DB_APP_USER}:${DB_USER_PASSWORD:-user_password}@mariadb:3306/${DB_NAME}"
    ports:
      - ${NOTIF_HOST_PORT}:${NOTIF_CONTAINER_PORT}
    restart: unless-stopped
    depends_on:
      - mariadb
      - smtp4dev
  
  smtp4dev:
    image: rnwood/smtp4dev
    ports:
      - ${DEV_UI_PORT}:80 #80 is the universal HTTP port
      - ${DEV_SMTP_PORT}:25 #25 is the universal SMTP port

volumes:
  notification_data: {}

