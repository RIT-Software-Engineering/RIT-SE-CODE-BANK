name: notification-service

services:
  mariadb:
    image: mariadb:11
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_APP_USER}
      MYSQL_PASSWORD: ${DB_USER_PASSWORD:-user_password}
    ports:
      - ${DB_HOST_PORT}:3306
    volumes:
      - notification_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
  
  notify:
    build: 
      context: ../..
      dockerfile: services/notification-service/Dockerfile
    environment:
      SMTP_PORT: ${SMTP_PORT}
      SMTP_FROM: ${SMTP_FROM}
      PORT: ${NOTIF_HOST_PORT}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-xoxb}
      DATABASE_URL: "mysql://${DB_APP_USER}:${DB_USER_PASSWORD:-user_password}@mariadb:3306/${DB_NAME}"
    ports:
      - ${NOTIF_HOST_PORT}:${NOTIF_CONTAINER_PORT}

volumes:
  notification_data: {}

