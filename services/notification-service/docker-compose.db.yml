version: '3.8'
services:
  mysql:
    image: mysql:8.0
    container_name: rit_notification_mysql
    environment:
      MYSQL_ROOT_PASSWORD: newPassword
      MYSQL_DATABASE: rit_notifications
    ports:
      - '3307:3306'
    volumes:
      - rit_mysql_data:/var/lib/mysql

volumes:
  rit_mysql_data:
